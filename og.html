<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: linear-gradient(135deg, #0D0D15 0%, #14142A 55%, #10202E 100%);
    font-family: "Pretendard", sans-serif; color: #F4F5FA; position: relative;
  }
  .bg { position: absolute; inset: 0; z-index: 1; }
  .card { position: relative; z-index: 2; height: 100%; display: flex; flex-direction: column; justify-content: center; padding: 0 84px; }
  .brand { display: flex; align-items: center; gap: 16px; margin-bottom: 28px; }
  .brand .tx { font-family: "Space Grotesk", sans-serif; font-weight: 600; font-size: 20px; letter-spacing: 0.06em; color: #C8CBE6; }
  .brand .tx small { display: block; font-family: "JetBrains Mono", monospace; font-size: 12px; letter-spacing: 0.2em; color: #6E7299; margin-top: 4px; }
  h1 { font-family: "Space Grotesk", sans-serif; font-size: 116px; font-weight: 700; letter-spacing: -0.04em; line-height: 0.95; }
  h1 .x { color: #2BBFD0; font-weight: 500; }
  .tagline { margin-top: 24px; font-size: 30px; font-weight: 600; color: #DDE0F0; line-height: 1.4; letter-spacing: -0.01em; }
  .meta { margin-top: 38px; display: flex; gap: 12px; }
  .meta span { font-family: "JetBrains Mono", monospace; font-size: 15px; letter-spacing: 0.04em; padding: 10px 18px; border: 1px solid rgba(120,128,200,0.5); border-radius: 999px; color: #B7BBDA; }
  .credit { position: absolute; bottom: 50px; right: 84px; z-index: 2; font-family: "JetBrains Mono", monospace; font-size: 15px; letter-spacing: 0.06em; color: #5E6288; text-align: right; line-height: 1.7; }
</style>
</head>
<body>
  <svg class="bg" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <pattern id="d" width="40" height="40" patternUnits="userSpaceOnUse">
        <circle cx="20" cy="20" r="1.6" fill="#FFFFFF" fill-opacity="0.05" />
      </pattern>
      <radialGradient id="g" cx="82%" cy="26%" r="62%">
        <stop offset="0%" stop-color="#2BBFD0" stop-opacity="0.2" />
        <stop offset="100%" stop-color="#2BBFD0" stop-opacity="0" />
      </radialGradient>
      <filter id="gl" x="-80%" y="-80%" width="260%" height="260%">
        <feGaussianBlur stdDeviation="6" result="b" />
        <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
      </filter>
    </defs>
    <rect width="1200" height="630" fill="url(#d)" />
    <rect width="1200" height="630" fill="url(#g)" />
    <g transform="translate(800,150)">
      <g id="row" fill="#3C3F66"></g>
      <polyline points="40,235 95,205 70,175 130,145 100,115 185,85 155,55 220,40 195,12"
        fill="none" stroke="#E6B84A" stroke-width="2.4" stroke-opacity="0.6" />
      <g fill="#E6B84A" filter="url(#gl)">
        <circle cx="40" cy="235" r="9" /><circle cx="95" cy="205" r="9" /><circle cx="70" cy="175" r="9" />
        <circle cx="130" cy="145" r="9" /><circle cx="100" cy="115" r="9" /><circle cx="185" cy="85" r="9" />
        <circle cx="155" cy="55" r="9" /><circle cx="220" cy="40" r="9" /><circle cx="195" cy="12" r="9" />
      </g>
    </g>
  </svg>
  <div class="card">
    <div class="brand">
      <svg width="56" height="56" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
        <rect width="48" height="48" rx="12" fill="#1C1C34" stroke="#33335A" />
        <g fill="#5B6BD8" fill-opacity="0.55">
          <circle cx="9" cy="9" r="1.7"/><circle cx="24" cy="7" r="1.7"/><circle cx="39" cy="9" r="1.7"/>
          <circle cx="7" cy="24" r="1.7"/><circle cx="41" cy="24" r="1.7"/>
          <circle cx="9" cy="39" r="1.7"/><circle cx="24" cy="41" r="1.7"/><circle cx="39" cy="39" r="1.7"/>
        </g>
        <g fill="#E6B84A">
          <circle cx="16" cy="16" r="2.9"/><circle cx="24" cy="16" r="2.9"/><circle cx="32" cy="16" r="2.9"/>
          <circle cx="16" cy="24" r="2.9"/><circle cx="24" cy="24" r="2.9"/><circle cx="32" cy="24" r="2.9"/>
          <circle cx="16" cy="32" r="2.9"/><circle cx="24" cy="32" r="2.9"/><circle cx="32" cy="32" r="2.9"/>
        </g>
      </svg>
      <div class="tx">SUNNY ENT. × STARROAD ENM<small>Global Partnership Proposal</small></div>
    </div>
    <h1>MADE 100 <span class="x">×</span> TikTok</h1>
    <div class="tagline">100 AI idols, created by the world.<br/>TikTok debuts <b style="color:#E6B84A">nine</b> of them.</div>
    <div class="meta">
      <span>Global AI Idol Audition</span>
      <span>KO · EN · 中文</span>
    </div>
  </div>
  <div class="credit">파트너십 제안서 / 合作提案<br/>nextsunny-ai.github.io/made-100</div>
  <script>
    var rg = document.getElementById('row');
    for (var r = 0; r < 10; r++) for (var c = 0; c < 10; c++) {
      var ci = document.createElementNS('http://www.w3.org/2000/svg','circle');
      ci.setAttribute('cx', 12 + c * 27); ci.setAttribute('cy', 12 + r * 27); ci.setAttribute('r', 3.2);
      rg.appendChild(ci);
    }
  </script>
</body>
</html>
